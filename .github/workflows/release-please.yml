name: Release

# On every push to main, release-please keeps a "release" pull request up to date
# (new version in Core.lua and Bridge.toc, CHANGELOG.md). Merging that pull request
# creates the tag vX.Y.Z and the GitHub release; then BigWigs Packager builds
# Bridge-vX.Y.Z.zip, attaches it to the GitHub release and uploads it to CurseForge.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Only when the release pull request has just been merged
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          fetch-depth: 0

      # Builds .release/Bridge-vX.Y.Z.zip and uploads it to CurseForge (project ID in Bridge.toc).
      # No GITHUB_OAUTH: the packager would replace the release notes with the whole CHANGELOG.
      - uses: BigWigsMods/packager@v2
        if: ${{ steps.release.outputs.release_created }}
        with:
          args: -n "{package-name}-{project-version}:{project-version}"
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}

      - name: Attach the zip to the GitHub release
        if: ${{ steps.release.outputs.release_created }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" .release/*.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
